<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>專注獨釣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: one quiet column, the lake scene on top, a single paper panel below that changes with each stage of the trip */
:root{
  --bg:#E6ECE9; --surface:#F3F6F4; --fg:#24322E; --muted:#61716C; --line:#C8D3CE;
  --accent:#A87D35; --accent-ink:#FFFDF7; --deep:#2E4844; --warn:#A9534A; --night:#0D1414; --night-fg:#7F8F8B;
  --r-common:#768A84; --r-uncommon:#3F7F78; --r-rare:#566CA6; --r-legend:#A87D35; --r-surprise:#9C6688;
  --scene-dim:1;
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --f-body:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101918; --surface:#172322; --fg:#DCE5E1; --muted:#94A49F; --line:#2B3B38;
  --accent:#D7B26C; --accent-ink:#1B1810; --deep:#BCD5CE; --warn:#E28B7E; --night:#050808; --night-fg:#5F6E6A;
  --r-common:#9AADA7; --r-uncommon:#73B5AC; --r-rare:#94A6DA; --r-legend:#D7B26C; --r-surprise:#CF98BA;
  --scene-dim:.84; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101918; --surface:#172322; --fg:#DCE5E1; --muted:#94A49F; --line:#2B3B38;
  --accent:#D7B26C; --accent-ink:#1B1810; --deep:#BCD5CE; --warn:#E28B7E; --night:#050808; --night-fg:#5F6E6A;
  --r-common:#9AADA7; --r-uncommon:#73B5AC; --r-rare:#94A6DA; --r-legend:#D7B26C; --r-surprise:#CF98BA;
  --scene-dim:.84; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:.08em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--fg)}
.ghost b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);margin-left:4px}

/* stage */
.stage{position:relative;aspect-ratio:4/3.1;max-width:100%;border-radius:20px;overflow:hidden;background:var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;filter:brightness(var(--scene-dim))}
.boat{position:absolute;left:24%;bottom:13%;width:50%;overflow:visible;filter:brightness(var(--scene-dim))}
.tag{position:absolute;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;gap:8px;color:#2A3633;font-size:12px;letter-spacing:.06em;pointer-events:none}
.tag .nm{font-family:var(--f-display);font-size:17px;letter-spacing:.1em}
.tag .co{font-variant-numeric:tabular-nums;opacity:.75;align-self:flex-start;padding-top:3px}
.bob{animation:bob 4.2s ease-in-out infinite;transform-origin:105px 100px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(3px) rotate(1.2deg)}}
.cat{transform-box:fill-box;transform-origin:50% 100%}
.alarm,.splash ellipse,.dart{opacity:0}
.stage.scared{animation:shake .5s ease-in-out}
.stage.scared .cat{animation:jump .8s cubic-bezier(.3,1.6,.5,1)}
.stage.scared .alarm{animation:pop 1.6s ease-out}
.stage.scared .splash ellipse{animation:ring 1.2s ease-out}
.stage.scared .splash ellipse:nth-child(2){animation-delay:.18s}
.stage.scared .dart{animation:dart 1.3s ease-in .1s}
.bobber{transform-box:fill-box;transform-origin:center}
.stage.bite .bobber{animation:bite 1s ease-in-out infinite}
.stage.reeling .cat{animation:hop .45s ease-in-out 2}
.stage.reeling .rod{animation:pull .9s ease-in-out}
.rod{transform-origin:118px 72px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-22px) scaleY(1.08)}60%{transform:translateY(0) scaleY(.92)}100%{transform:none}}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:translateY(-4px)}70%{opacity:1}100%{opacity:0}}
@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.8)}}
.splash ellipse{transform-box:fill-box;transform-origin:center}
@keyframes dart{0%{opacity:.6;transform:translateX(0)}100%{opacity:0;transform:translateX(60px)}}
@keyframes bite{0%,100%{transform:translateY(0)}30%{transform:translateY(6px)}55%{transform:translateY(-1px)}75%{transform:translateY(4px)}}
@keyframes hop{50%{transform:translateY(-8px)}}
@keyframes pull{40%{transform:rotate(-14deg)}100%{transform:none}}

/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:16px}
.label{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:8px}
.spots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.spots::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:0;min-width:92px}
.chip .a{font-family:var(--f-display);font-size:16px}
.chip .b{font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}
.durs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dur{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.dur .n{font-size:18px;font-weight:600;line-height:1.2}
.dur .u{font-size:11px;color:var(--muted)}
.dur[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px;font-size:17px;font-family:var(--f-display);letter-spacing:.2em;font-weight:700}
.primary:active{transform:translateY(1px)}
.rules{font-size:13px;color:var(--muted);margin:0;display:flex;flex-direction:column;gap:4px;padding:0;list-style:none}
.rules li{display:flex;gap:8px}
.rules li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-top:.6em;opacity:.6}
.toggle{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);border-radius:8px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.notice{font-size:13px;color:var(--warn);margin:0}
.center{text-align:center;align-items:center}
.big{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance;line-height:1.4}
.sub{margin:0;color:var(--muted);font-size:14px;text-wrap:balance}
.ringwrap{position:relative;width:120px;height:120px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-variant-numeric:tabular-nums;font-weight:300}
.ring-bg{stroke:var(--line)} .ring-fg{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.timer{font-size:44px;font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:.04em;line-height:1}
.meter{display:flex;flex-direction:column;gap:6px;width:100%}
.meter .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--warn);width:0;transition:width .4s}
.row2{display:flex;gap:8px;width:100%}
.row2>*{flex:1}
.quiet{background:transparent;border:1px solid var(--line);border-radius:14px;padding:11px;font-size:14px;color:var(--muted)}
.quiet.armed{border-color:var(--warn);color:var(--warn)}

/* reveal card */
.catch{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:rise .9s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.catch .art{width:180px;max-width:100%}
.pill{font-size:12px;letter-spacing:.14em;padding:2px 12px;border-radius:999px;border:1px solid currentColor}
.catch h2{font-family:var(--f-display);font-size:30px;margin:0;letter-spacing:.06em}
.catch .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.catch .desc{margin:0;font-size:15px;max-width:34em;text-align:left}
.bless{width:100%;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.bless .t{font-family:var(--f-display);font-size:18px;color:var(--deep);text-wrap:balance}
.legendglow{filter:drop-shadow(0 0 10px rgba(240,210,140,.9))}

/* dex sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .app{gap:18px}
.dexspot{display:flex;flex-direction:column;gap:8px}
.dexspot h3{margin:0;font-family:var(--f-display);font-size:18px;font-weight:400;display:flex;justify-content:space-between;align-items:baseline}
.dexspot h3 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dexgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cell svg{width:100%;max-width:64px;height:auto}
.cell .nm{font-size:12px;line-height:1.3;text-align:center;font-family:var(--f-display);overflow-wrap:anywhere}
.cell .x{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell.unk .nm{color:var(--muted)}
.cell.unk svg{opacity:.35}
#dexDetail{animation:none}

/* simulated screen-off */
.dark{position:fixed;inset:0;z-index:40;background:var(--night);color:var(--night-fg);display:grid;place-items:center;text-align:center;font-size:13px;letter-spacing:.1em;border:0;width:100%}
@media (prefers-reduced-motion:reduce){
  .bob,.stage.scared,.stage.scared .cat,.stage.bite .bobber,.stage.reeling .cat,.stage.reeling .rod,.catch{animation:none!important}
  .stage.scared .alarm{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>專注獨釣</h1><span>FocusFishing</span></div>
    <button class="ghost" id="btnDex" type="button">圖鑑<b id="dexCount">0/28</b></button>
  </header>

  <section class="stage" id="stage" aria-label="釣點風景">
    <canvas id="scene"></canvas>
    <svg class="boat" viewBox="0 0 220 140" aria-hidden="true">
      <g class="bob">
        <path class="dart" d="M150 128 q10 -6 20 0 q-10 6 -20 0 z M170 128 l7 -5 v10 z" fill="rgba(40,60,60,.45)"/>
        <g class="splash"><ellipse cx="196" cy="118" rx="14" ry="4" fill="none" stroke="#fff" stroke-width="1.5"/><ellipse cx="196" cy="118" rx="14" ry="4" fill="none" stroke="#fff" stroke-width="1.2"/></g>
        <g class="rod">
          <line x1="118" y1="72" x2="178" y2="16" stroke="#6B4F38" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M178 16 Q190 60 196 116" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1"/>
        </g>
        <g class="bobber"><circle cx="196" cy="116" r="3.6" fill="#D2533F"/><rect x="194.6" y="109" width="2.8" height="5" fill="#F4EEE4"/></g>
        <g class="cat">
          <path d="M72 88 Q52 84 58 66 Q61 60 65 64 Q62 76 78 82 Z" fill="#D9A56B"/>
          <ellipse cx="92" cy="80" rx="22" ry="18" fill="#F2E4CD"/>
          <path d="M76 70 Q90 62 104 68 Q98 74 80 76 Z" fill="#D9A56B"/>
          <circle cx="112" cy="61" r="14" fill="#F2E4CD"/>
          <polygon points="101,53 104,38 112,49" fill="#F2E4CD"/>
          <polygon points="114,48 122,37 124,54" fill="#D9A56B"/>
          <path d="M106 52 Q112 47 118 50" stroke="#D9A56B" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M114 62 q2.5 2 5 0" stroke="#3B3430" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <ellipse cx="121" cy="66" rx="1.6" ry="1.2" fill="#C98378"/>
          <ellipse cx="114" cy="78" rx="6" ry="4" fill="#F2E4CD" stroke="#E3D1B5"/>
        </g>
        <path d="M22 94 Q110 106 200 92 L188 110 Q110 126 34 110 Z" fill="#8A684C"/>
        <path d="M26 98 Q110 109 196 96" stroke="#A9835F" stroke-width="2" fill="none"/>
        <path d="M34 110 Q110 126 188 110" stroke="rgba(255,255,255,.35)" stroke-width="1.2" fill="none"/>
        <g class="alarm"><rect x="128" y="18" width="40" height="26" rx="10" fill="#FFFDF7"/><path d="M134 42 l-4 8 l10 -6z" fill="#FFFDF7"/><text x="148" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#A9534A">喵！</text></g>
      </g>
    </svg>
    <div class="tag"><span class="nm" id="tagName"></span><span class="co" id="tagCoord"></span></div>
  </section>

  <!-- home -->
  <section class="panel" id="pHome">
    <div class="group">
      <span class="label">今天去哪裡釣</span>
      <div class="spots" id="spots" role="group" aria-label="釣點"></div>
    </div>
    <div class="group">
      <span class="label">專注多久</span>
      <div class="durs" id="durs" role="group" aria-label="專注時間"></div>
    </div>
    <ul class="rules">
      <li>按下出航後，10 秒內關上螢幕，小貓才會出發。</li>
      <li>中途打開手機畫面會嚇到小貓，螢幕亮著的時間都算分心（用其他 App 也算）。累積滿 5 分鐘，魚就全部游走了。</li>
      <li>專注越久，越有機會遇見稀有的魚和傳說生物。</li>
    </ul>
    <label class="toggle" for="sim"><input type="checkbox" id="sim">試玩模式（用按鈕模擬關螢幕，方便在電腦上試）</label>
    <p class="notice" id="homeNotice" hidden></p>
    <button class="primary" id="btnGo" type="button">出　航</button>
  </section>

  <!-- launching -->
  <section class="panel center" id="pLaunch" hidden>
    <div class="ringwrap"><svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="44" fill="none" stroke-width="5"/><circle class="ring-fg" id="ringFg" cx="50" cy="50" r="44" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="num" id="launchNum">10</div></div>
    <p class="big">小貓解開纜繩了，<br>請關上螢幕。</p>
    <p class="sub" id="launchSub"></p>
    <div class="row2"><button class="quiet" id="btnLaunchCancel" type="button">先不去了</button><button class="primary" id="btnSimOff1" type="button" hidden>模擬關螢幕</button></div>
  </section>

  <!-- running, screen opened -->
  <section class="panel center" id="pRun" hidden>
    <p class="big" id="scareLine"></p>
    <div><div class="label">還要釣</div><div class="timer" id="remain">00:00</div></div>
    <div class="meter">
      <div class="row"><span>分心時間</span><span id="distTxt">0:00 / 5:00</span></div>
      <div class="bar"><i id="distBar"></i></div>
    </div>
    <p class="sub">關上螢幕，小貓就能繼續安靜地釣。</p>
    <div class="row2"><button class="quiet" id="btnGiveUp" type="button">收船回家</button><button class="primary" id="btnSimOff2" type="button" hidden>模擬關螢幕</button></div>
  </section>

  <!-- done -->
  <section class="panel center" id="pDone" hidden>
    <p class="big">時間到了，浮標在動！</p>
    <p class="sub" id="doneSub"></p>
    <button class="primary" id="btnReel" type="button">收　線</button>
  </section>

  <!-- fail -->
  <section class="panel center" id="pFail" hidden>
    <p class="big">魚兒們都游走了</p>
    <p class="sub">分心時間滿 5 分鐘，小貓抱著空水桶慢慢划回岸邊。沒關係，湖還在，明天再來。</p>
    <button class="primary" id="btnFailBack" type="button">回到岸邊</button>
  </section>

  <!-- reveal -->
  <section class="panel" id="pReveal" hidden>
    <div class="catch" id="catchCard"></div>
    <div class="row2"><button class="quiet" id="btnSeeDex" type="button">看圖鑑</button><button class="primary" id="btnAgain" type="button">再出航</button></div>
  </section>
</div>

<div class="sheet" id="dex" hidden role="dialog" aria-label="魚類圖鑑">
  <div class="app">
    <header class="top"><div class="brand"><h1>圖鑑</h1><span id="dexTotal"></span></div><button class="ghost" id="btnDexClose" type="button">關閉</button></header>
    <section class="panel" id="dexDetail" hidden></section>
    <div id="dexBody" style="display:flex;flex-direction:column;gap:18px"></div>
  </div>
</div>

<button class="dark" id="darkScreen" type="button" hidden>螢幕已關上（試玩模擬）<br>小貓正在安靜地釣魚<br><br>輕點一下＝打開手機</button>

<script>

  ridges:[{c:'#B3C4C1',amp:.2,f:5,seed:1.2,type:'hill'},{c:'#8FA7A3',amp:.14,f:7,seed:3.1,type:'hill'},{c:'#6E8A86',amp:.07,f:9,seed:5.4,type:'hill'}],water:['#C1D2CF','#7C9A96'],island:true},

document.addEventListener('visibilitychange',onVis);

$('btnGo').onclick=()=>{
  notice('');S={state:'launch',spot:pref.spot,dur:DURS[pref.dur].m,launchAt:Date.now(),distractMs:0,visSince:null,sim:!!pref.sim,native:NATIVE&&!pref.sim};save();
  if(S.native)FG.arm({dur:S.dur,spot:S.spot,spotName:SPOTS[S.spot].name});
  $('btnSimOff1').hidden=!S.sim; $('launchSub').textContent=`目的地：${spot.name}・專注 ${S.dur} 分鐘`;
  show('pLaunch'); let n=LAUNCH; const ring=$('ringFg');
  const upd=()=>{$('launchNum').textContent=n;ring.style.strokeDashoffset=276.5*(1-n/LAUNCH)};upd();
  clearInterval(launchT); launchT=setInterval(()=>{if(!S||S.state!=='launch'){clearInterval(launchT);return}n--;upd();
    if(n<=0){clearInterval(launchT);if(S.native){setTimeout(()=>nRefresh(false),600);return}if(!isHidden()){S=null;save();show('pHome');notice(MSG_WAIT)}}},1000);
};
$('btnLaunchCancel').onclick=()=>{clearInterval(launchT);if(S&&S.native)FG.stop();S=null;save();show('pHome')};

function onVis(){if(!S||S.native)return; isHidden()?onHide():onShow(false)}
function onHide(){
  const now=Date.now();
  if(S.state==='launch'){clearInterval(launchT);S.state='run';S.startAt=now;S.visSince=null;save();return}
  if(S.state==='run'&&S.visSince){S.distractMs+=now-S.visSince;S.visSince=null;save()}
  clearInterval(tickT);
}
function onShow(fromLoad){
  if(S.state==='launch'){if(fromLoad){S=null;save();show('pHome')}return}
  if(S.state==='done'){finishUI();return}
  if(S.state!=='run')return;
  const now=Date.now();
  if(now-S.startAt>=S.dur*60000){S.visSince=null;S.state='done';save();finishUI();return}
  S.visSince=now;save();
  $('btnSimOff2').hidden=!S.sim;
  $('scareLine').textContent=SCARES[Math.floor(Math.random()*SCARES.length)];
  show('pRun');scare();tick();clearInterval(tickT);tickT=setInterval(tick,500);
}
function scare(){const st=$('stage');st.classList.remove('scared');void st.offsetWidth;st.classList.add('scared');setTimeout(()=>st.classList.remove('scared'),1700)}
function tick(){
  if(!S||S.state!=='run'||(!S.native&&isHidden())){clearInterval(tickT);return}
  const now=Date.now(), d=S.native?S.distractMs+(S.onSince?now-S.onSince:0):S.distractMs+(now-(S.visSince||now)), left=S.dur*60000-(now-S.startAt);
  if(S.native){$('remain').textContent=mmss(left);$('distTxt').textContent=mss(Math.min(d,LIMIT))+' / 5:00';$('distBar').style.width=Math.min(100,d/LIMIT*100)+'%';return}
  $('remain').textContent=mmss(left);$('distTxt').textContent=mss(d)+' / 5:00';$('distBar').style.width=Math.min(100,d/LIMIT*100)+'%';
  if(d>=LIMIT){clearInterval(tickT);S=null;save();show('pFail');return}
  if(left<=0){clearInterval(tickT);S.distractMs=d;S.visSince=null;S.state='done';save();finishUI()}
}
function finishUI(){$('doneSub').textContent=`在${SPOTS[S.spot].name}專注了 ${S.dur} 分鐘，分心 ${mss(S.distractMs)}。`;show('pDone')}
$('btnGiveUp').onclick=e=>{const b=e.currentTarget;if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='再按一次確定收船';setTimeout(()=>{b.classList.remove('armed');b.textContent='收船回家'},3000);return}
  b.classList.remove('armed');b.textContent='收船回家';clearInterval(tickT);clearInterval(pollT);if(S&&S.native)FG.stop();S=null;save();show('pHome')};
$('btnFailBack').onclick=()=>{if(NATIVE)FG.clear();show('pHome')};

function pick(m,ratio){
  const k=1-.6*ratio, w={common:Math.max(25,70-m),uncommon:25,rare:(4+m*.35)*k,legend:(m>=10?.5+m*.08:.2)*k,surprise:7};
  let r=Math.random()*Object.values(w).reduce((a,b)=>a+b,0),tier='common';
  for(const [t,v] of Object.entries(w)){if((r-=v)<=0){tier=t;break}}
  const pool=ITEMS.filter(i=>i.r===tier&&(tier==='surprise'||i.spot===SPOTS[S.spot].id));
  return pool[Math.floor(Math.random()*pool.length)];
}
function card(it,meta){
  const R=RAR[it.r];
  return `<div class="art">${art(it)}</div><span class="pill" style="color:var(${R.v})">${R.t}</span><h2>${it.name}</h2>${meta?`<div class="meta">${meta}</div>`:''}<p class="desc">${it.desc}</p><div class="bless"><span class="label">給你的祝福</span><span class="t">${it.bless}</span></div>`;
}
$('btnReel').onclick=()=>{
  if(!S)return; const st=$('stage'); st.classList.remove('bite'); st.classList.add('reeling'); $('btnReel').disabled=true;
  setTimeout(()=>{
    st.classList.remove('reeling'); $('btnReel').disabled=false;
    const it=pick(S.dur,Math.min(1,S.distractMs/LIMIT)); const first=!dex[it.id];
    dex[it.id]={n:(dex[it.id]?.n||0)+1,at:dex[it.id]?.at||Date.now()}; store.set('dex',dex); dexCount();
    const meta=`${SPOTS[S.spot].name}・專注 ${S.dur} 分鐘${first?'・第一次遇見':'・第 '+dex[it.id].n+' 次'}`;
    if(S.native)FG.clear(); S=null;save(); $('catchCard').innerHTML=card(it,meta); $('catchCard').style.animation='none';void $('catchCard').offsetWidth;$('catchCard').style.animation=''; show('pReveal');
  },reduce?100:950);
};
$('btnAgain').onclick=()=>show('pHome');

/* ---------- dex ---------- */
function openDex(){
  const n=dexCount(); $('dexTotal').textContent=`已遇見 ${n} / ${ITEMS.length}`; $('dexDetail').hidden=true;
  const groups=[...SPOTS.map(s=>({t:s.name,sub:s.place,items:ITEMS.filter(i=>i.spot===s.id)})),{t:'小驚喜',sub:'任何釣點都可能撈到',items:ITEMS.filter(i=>i.spot==='*')}];
  $('dexBody').innerHTML=groups.map(g=>{const got=g.items.filter(i=>dex[i.id]).length;return `<div class="dexspot"><h3>${g.t}<small>${g.sub}・${got}/${g.items.length}</small></h3><div class="dexgrid">${g.items.map(i=>{const k=!!dex[i.id];return `<button type="button" class="cell ${k?'':'unk'}" data-id="${i.id}" ${k?'':'disabled'}>${art(i,k)}<span class="nm">${k?i.name:'？？？'}</span><span class="x">${k?'×'+dex[i.id].n:RAR[i.r].t}</span></button>`}).join('')}</div></div>`}).join('');
  $('dex').hidden=false; $('dex').scrollTop=0;
}
$('dexBody').onclick=e=>{const b=e.target.closest('.cell');if(!b||b.disabled)return;const it=ITEMS.find(i=>i.id===b.dataset.id);const d=$('dexDetail');d.innerHTML=`<div class="catch">${card(it,'已釣到 '+dex[it.id].n+' 次')}</div>`;d.hidden=false;$('dex').scrollTop=0};
$('btnDex').onclick=openDex; $('btnSeeDex').onclick=openDex; $('btnDexClose').onclick=()=>$('dex').hidden=true;

/* ---------- native ---------- */
async function nRefresh(scareIt){
  let st; try{st=await FG.status()}catch(e){return}
  const was=S&&S.native?S.state:null;
  if(st.state==='launch'){ if(!S){S={state:'launch',spot:st.spot,dur:st.dur,native:true};setSpot(st.spot);show('pLaunch')} return }
  if(st.state==='cancelled'){clearInterval(launchT);FG.clear();S=null;show('pHome');notice(MSG_WAIT);return}
  if(st.state==='run'){
    S={state:'run',spot:st.spot,dur:st.dur,startAt:st.startAt,distractMs:st.distractMs,onSince:st.onSince,native:true};setSpot(st.spot);
    if(scareIt||was!=='run'){$('btnSimOff2').hidden=true;$('scareLine').textContent=SCARES[Math.floor(Math.random()*SCARES.length)];show('pRun');scare()}
    tick();clearInterval(tickT);tickT=setInterval(tick,500);
    clearInterval(pollT);pollT=setInterval(()=>nRefresh(false),2000);return}
  clearInterval(tickT);clearInterval(pollT);
  if(st.state==='done'){S={state:'done',spot:st.spot,dur:st.dur,distractMs:st.distractMs,native:true};setSpot(st.spot);finishUI();return}
  if(st.state==='fail'){S=null;show('pFail');return}
  if(S&&S.native&&S.state!=='done'){S=null;show('pHome')}
}
if(NATIVE){
  APP.addListener('appStateChange',({isActive})=>{if(isActive)nRefresh(true);else{clearInterval(tickT);clearInterval(pollT)}});
  try{FG.askPermission()}catch(e){}
}

/* ---------- boot ---------- */
function bootWeb(){
  setSpot(S?S.spot:(pref.spot||0));
  if(S){ if(S.state==='run'){S.visSince=null;} if(!isHidden())onShow(true); } else show('pHome');
}
dexCount();
if(NATIVE){ if(S&&!S.sim)S=null; FG.status().then(st=>{ if(st.state!=='idle'){setSpot(st.spot);show('pHome');nRefresh(true)} else bootWeb() }).catch(bootWeb) } else bootWeb();
if(!reduce)requestAnimationFrame(loop);
})();
</script>
