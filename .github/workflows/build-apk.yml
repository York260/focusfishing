name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['desktop/**', '.github/workflows/build-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install & sync web assets
        run: |
          npm ci
          npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../FocusFishing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FocusFishing-apk
          path: FocusFishing.apk

      - name: Read version
        id: ver
        run: echo "v=v$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: 專注獨釣 ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: FocusFishing.apk
          body: 下載 FocusFishing.apk 到手機安裝即可。更新版本時直接覆蓋安裝，圖鑑不會消失。
